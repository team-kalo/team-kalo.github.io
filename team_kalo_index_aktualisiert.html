<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Kalo | Pickleball League</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f4f4f4;background:#101820}*{box-sizing:border-box}body{margin:0}header{background:#192733;border-bottom:1px solid #35434c;padding:16px 5%;display:flex;align-items:center;gap:16px}header img{height:75px;width:75px;object-fit:contain;border-radius:12px}h1{margin:0;font-size:clamp(22px,4vw,38px)}small,.muted{color:#aab8c3}main{max-width:1100px;margin:auto;padding:25px 18px 80px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tabs button,button{background:#2b4353;color:white;border:1px solid #547084;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:650}.tabs button.active,button.primary{background:#eeb64a;color:#151c23;border-color:#eeb64a}.panel{background:#1a2935;border:1px solid #324451;border-radius:15px;padding:20px;margin:15px 0}h2{margin:0 0 16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #344653}th{color:#b9c6cd;font-size:13px}td:last-child,th:last-child{text-align:right}.avatar{width:40px;height:40px;object-fit:cover;border-radius:50%;background:#364958;vertical-align:middle;margin-right:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.player{display:flex;align-items:center;gap:10px;cursor:pointer}.player img{width:62px;height:62px;object-fit:cover;border-radius:50%;background:#344654}.match{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #344653;padding:14px 0}.match:last-child{border:0}.score{font-size:22px;font-weight:800;color:#eeb64a}input,select{width:100%;padding:11px;background:#101b24;color:white;border:1px solid #526574;border-radius:8px;margin:6px 0 14px}label{font-size:14px;color:#cbd7dc}form{max-width:650px}.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.note{background:#263b48;border-left:3px solid #eeb64a;padding:12px;border-radius:5px}.hidden{display:none}.tag{display:inline-block;border-radius:20px;background:#334b59;padding:5px 10px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}a{color:#f4c66b}@media(max-width:500px){th,td{padding:10px 3px;font-size:13px}.avatar{width:30px;height:30px;margin-right:5px}.panel{padding:14px}}

.player-card{flex-direction:column;text-align:center;justify-content:center;min-height:170px;transition:transform .15s,border-color .15s}.player-card:hover{transform:translateY(-3px);border-color:#eeb64a}.player-card img{width:94px;height:94px}.profile-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.profile-top img{width:130px;height:130px;object-fit:cover;border-radius:50%;background:#344654}.profile-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.profile-details>div{background:#223543;padding:14px;border-radius:10px}.profile-details small{display:block;margin-bottom:5px}.crop-overlay.hidden{display:none}.crop-overlay{position:fixed;inset:0;z-index:20;background:#000c;display:flex;align-items:center;justify-content:center;padding:15px}.crop-box{background:#1a2935;padding:20px;border-radius:16px;width:min(95vw,520px)}.crop-stage{height:330px;background:#101820;overflow:hidden}.crop-stage img{display:block;max-width:100%}.crop-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#344654}.form-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}.error-msg{color:#ff9d9d}.form-help{font-size:12px;color:#aab8c3;margin:-8px 0 12px}
.player-inline{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}.player-inline .avatar{margin-right:0;flex-shrink:0}.player-name{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.country-flag{font-size:1.15em;line-height:1;white-space:nowrap}</style></head><body><header><img src="assets/logo.png" alt="Team Kalo Logo"><div><h1>TEAM KALO</h1><div class="muted">PICKLEBALL LEAGUE · SAISON 2026/27</div><small>Euregio-Sporthalle · Emsdetten</small></div></header><main><div class="tabs" id="tabs"></div><div id="content"></div></main><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"><script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL='https://wtqytkcbbysofiebakzd.supabase.co';const SUPABASE_KEY='sb_publishable_NFAhNLQ0aYAAOpVheW8eaA_tc4aS_xJ';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let session=null;let isAdmin=false;let statusMessage='';const KEY='team-kalo-v1';const sample={players:[],matches:[],playoffs:[],phase:'league'};let data=structuredClone(sample);let tab='Übersicht';let selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{};const uid=()=>crypto.randomUUID();const displayName=p=>p?.nickname||p?.name||'Unbekannt';const photo=p=>p.photo||'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(displayName(p));const name=id=>displayName(data.players.find(p=>p.id===id));const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('de-DE'):'–';
const countryCodes='DE AT CH NL BE FR ES PT IT GB IE DK SE NO FI IS PL CZ SK HU SI HR BA RS ME AL GR TR UA RO BG LT LV EE LU MT CY US CA MX BR AR CL CO PE UY PY BO EC VE CR PA CU DO JM AU NZ JP CN KR IN ZA MA EG NG GH KE IL AE SA TH VN PH ID MY SG PK BD NP'.split(' ');
const countryNames=new Intl.DisplayNames(['de'],{type:'region'});
const flag=code=>code&&/^[A-Z]{2}$/.test(code)?String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0))):'🌍';
const countryOptions=countryCodes.map(code=>({code,label:flag(code)+' '+countryNames.of(code)})).sort((a,b)=>a.label.slice(5).localeCompare(b.label.slice(5),'de')).map(x=>`<option value="${x.code}">${esc(x.label)}</option>`).join('');
const handOptions=[['right','Rechtshänder'],['left','Linkshänder'],['both','Beidhändig'],['two_weak','2 schwache Hände']];

let pendingPhoto=null;let cropper=null;

function stats(){let map={};data.players.forEach(p=>map[p.id]={...p,elo:1000,w:0,l:0,played:0});[...data.matches].filter(m=>m.stage==='league').sort((a,b)=>a.date.localeCompare(b.date)||a.created.localeCompare(b.created)).forEach(m=>{let a=map[m.a],b=map[m.b];if(!a||!b)return;let aw=m.sets.filter(s=>s[0]>s[1]).length,bw=m.sets.filter(s=>s[1]>s[0]).length;if(aw===bw)return;let winner=aw>bw?a:b,loser=aw>bw?b:a;let expected=1/(1+Math.pow(10,(loser.elo-winner.elo)/400));let change=Math.round(32*(1-expected));winner.elo+=change;loser.elo-=change;winner.w++;loser.l++;winner.played++;loser.played++});return Object.values(map).sort((a,b)=>b.elo-a.elo||b.w-a.w||displayName(a).localeCompare(displayName(b)))}
function navigate(t){tab=t;selected=null;render()}function render(){let tabs=['Übersicht','Tabelle','Spieler','Matches','Playoffs','Verwaltung'];$('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));$('#content').innerHTML=({Übersicht:overview,Tabelle:ranking,Spieler:players,Matches:matches,Playoffs:playoffs,Verwaltung:admin})[tab]();wire()}
function overview(){let s=stats(),recent=[...data.matches].reverse().slice(0,5);return `<div class="grid"><div class="panel"><small>SPIELER</small><h1>${data.players.length}</h1></div><div class="panel"><small>GESPIELTE MATCHES</small><h1>${data.matches.length}</h1></div><div class="panel"><small>TABELLENFÜHRER</small><h1>${esc(displayName(s[0])||'–')}</h1></div></div><div class="panel"><h2>Aktuelle Tabelle</h2>${table(s.slice(0,5))}</div><div class="panel"><h2>Letzte Matches</h2>${matchList(recent)}</div><p class="muted">11.11.2026 – 01.07.2027 · Einzel · Best of 3 oder 5 · Sätze bis 11</p>`}
function table(s){return `<table><thead><tr><th>#</th><th>Spieler</th><th>Spiele</th><th>S</th><th>N</th><th>Elo</th></tr></thead><tbody>${s.map((p,i)=>`<tr><td>${i+1}</td><td><span class="player-inline"><img class="avatar" src="${esc(photo(p))}" alt=""><span class="player-name">${esc(displayName(p))} <span class="country-flag" aria-label="Nationalität">${flag(p.nationality)}</span></span></span></td><td>${p.played}</td><td>${p.w}</td><td>${p.l}</td><td><strong>${p.elo}</strong></td></tr>`).join('')}</tbody></table>`}function ranking(){return `<div class="panel"><h2>Ligatabelle</h2><p class="muted">Alle starten bei 1.000 Elo. Pro Match werden anhand der gegnerischen Stärke Punkte vergeben.</p>${table(stats())}</div>`}function players(){if(selected){let p=stats().find(x=>x.id===selected);if(!p)return '<p>Spieler nicht gefunden.</p>';let detail=(label,value)=>`<div><small>${label}</small><strong>${esc(value||'–')}</strong></div>`;return `<button id="back">← Alle Spieler</button><div class="panel"><div class="profile-top"><img src="${esc(photo(p))}" alt="Profilbild"><div><h2 style="margin-bottom:6px">${esc(displayName(p))}</h2><div class="muted">${esc([p.first_name,p.last_name].filter(Boolean).join(' ')||p.name)}</div><p>${flag(p.nationality)} ${esc(p.nationality?countryNames.of(p.nationality):'Nationalität unbekannt')}</p><strong>${p.elo} Elo · ${p.w} Siege · ${p.l} Niederlagen</strong></div></div><div class="profile-details">${detail('Vorname',p.first_name)}${detail('Nachname',p.last_name)}${detail('Spitzname',displayName(p))}${detail('Geburtsdatum',p.birth_date?fmt(p.birth_date):'–')}${detail('Größe',p.height_cm?p.height_cm+' cm':'–')}${detail('Spielhand',handLabel(p.playing_hand))}</div><h3>Matchhistorie</h3>${matchList(data.matches.filter(m=>m.a===p.id||m.b===p.id).reverse())}</div>`}return `<h2>Spielerprofile</h2><div class="grid">${stats().map(p=>`<div class="panel player player-card" data-player="${esc(p.id)}" role="button" tabindex="0"><img src="${esc(photo(p))}" alt="Profilbild ${esc(displayName(p))}"><span class="player-name"><strong>${esc(displayName(p))}</strong> <span class="country-flag" aria-label="Nationalität">${flag(p.nationality)}</span></span></div>`).join('')||'<p class="muted">Noch keine Spieler vorhanden.</p>'}</div>`}
function matchList(arr){return arr.length?arr.map(m=>{let aw=m.sets.filter(s=>s[0]>s[1]).length,bw=m.sets.length-aw;return `<div class="match"><div><small>${fmt(m.date)}</small><div><strong>${esc(name(m.a))}</strong> vs. <strong>${esc(name(m.b))}</strong></div><small>${m.sets.map(s=>s.join(':')).join(' · ')}</small></div><div class="score">${aw}:${bw}</div></div>`}).join(''):'<p class="muted">Noch keine Ergebnisse vorhanden.</p>'}function matches(){return `<div class="panel"><h2>Alle Ergebnisse</h2>${matchList([...data.matches].sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
function playoffs(){let seeds=stats().slice(0,4);return `<div class="panel"><h2>Playoffs · Top 4</h2><p class="muted">Nach Abschluss der regulären Saison: Halbfinale 1. gegen 4. und 2. gegen 3.; anschließend Finale. Die Paarungen werden hier anhand des aktuellen Tabellenstands angezeigt und können sich bis zum Saisonende ändern.</p>${seeds.length<4?'<p>Mindestens vier Spieler erforderlich.</p>':`<div class="grid"><div class="panel"><span class="tag">Halbfinale 1</span><h3>${esc(displayName(seeds[0]))} vs. ${esc(displayName(seeds[3]))}</h3></div><div class="panel"><span class="tag">Halbfinale 2</span><h3>${esc(displayName(seeds[1]))} vs. ${esc(displayName(seeds[2]))}</h3></div><div class="panel"><span class="tag">Finale</span><h3>Sieger HF 1 vs. Sieger HF 2</h3></div></div>`}</div>`}
function admin(){if(!session)return `<div class="panel"><h2>Admin-Anmeldung</h2><p class="muted">Nur die Ligaleitung kann Daten bearbeiten.</p><form id="login"><label>E-Mail<input name="email" type="email" required autocomplete="username"></label><label>Passwort<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Anmelden</button></form>${esc(statusMessage)}</div>`;if(!isAdmin)return `<div class="panel"><h2>Kein Admin-Zugriff</h2><p>Dieser Account hat keine Schreibberechtigung.</p><button id="logout">Abmelden</button></div>`;let opts=data.players.map(p=>`<option value="${p.id}">${esc(displayName(p))}</option>`).join('');return `<div class="panel"><h2>Verwaltung</h2><p class="note">Änderungen werden zentral in Supabase gespeichert.</p><button id="logout">Abmelden</button><h3>Spieler hinzufügen</h3><form id="addPlayer"><div class="form-two"><label>Vorname<input name="first_name" required maxlength="60" placeholder="Vorname"></label><label>Nachname<input name="last_name" required maxlength="60" placeholder="Nachname"></label></div><label>Spitzname (Anzeige in der Liga)<input name="nickname" required maxlength="60" placeholder="z. B. El Matador"></label><div class="form-two"><label>Nationalität<select name="nationality" required><option value="">Land wählen</option>${countryOptions}</select></label><label>Geburtsdatum<input name="birth_date" type="date" max="${new Date().toISOString().slice(0,10)}"></label><label>Größe (cm)<input name="height_cm" type="number" min="80" max="250" step="1" placeholder="z. B. 177"></label><label>Spielhand<select name="playing_hand">${handOptions.map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}</select></label></div><label>Profilbild hochladen<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label><p class="form-help">Bild auswählen, anschließend Ausschnitt verschieben und zoomen.</p><img id="photoPreview" class="crop-preview hidden" alt="Zugeschnittenes Profilbild"><div style="margin:12px 0"><button class="primary" id="savePlayer" type="submit">Spieler hinzufügen</button></div></form><div id="cropModal" class="crop-overlay hidden"><div class="crop-box"><h3>Profilbild zuschneiden</h3><p class="muted">Bild verschieben und mit dem Mausrad oder per Zoom anpassen. Der Ausschnitt wird rund angezeigt.</p><div class="crop-stage"><img id="cropImage" alt="Bild zuschneiden"></div><div class="actions" style="margin-top:14px"><button type="button" id="cropZoomOut">− Zoom</button><button type="button" id="cropZoomIn">+ Zoom</button><button type="button" id="cropCancel">Abbrechen</button><button type="button" class="primary" id="cropConfirm">Ausschnitt übernehmen</button></div></div></div></div><div class="panel"><h3>Match eintragen</h3><form id="addMatch"><label>Datum<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>Spieler A<select name="a" required>${opts}</select></label><label>Spieler B<select name="b" required>${opts}</select></label><label>Format<select id="format" name="format"><option value="3">Best of 3</option><option value="5">Best of 5</option></select></label><div id="setInputs"></div><button class="primary" ${data.players.length<2?'disabled':''}>Ergebnis speichern</button></form></div><div class="panel"><h3>Ergebnisse korrigieren / löschen</h3>${[...data.matches].reverse().map(m=>`<div class="match"><span>${fmt(m.date)} · ${esc(name(m.a))} – ${esc(name(m.b))} · ${m.sets.map(s=>s.join(':')).join(', ')}</span><button data-delete="${m.id}">Löschen</button></div>`).join('')||'<p class="muted">Noch keine Matches.</p>'}</div><div class="panel"><h3>Daten sichern</h3><p class="muted">Exportiere die Liga als JSON-Datei. Du kannst diese später wieder importieren.</p><div class="actions"><button id="export">JSON exportieren</button></div></div>`}
function setsUI(){let n=Number($('#format')?.value||3);$('#setInputs').innerHTML=`<p class="muted">Satzergebnisse (nur tatsächlich gespielte Sätze ausfüllen)</p><div class="sets">${Array.from({length:n},(_,i)=>`<label>Satz ${i+1} · Spieler A<input type="number" min="0" max="99" name="a${i}" placeholder="–"></label><label>Satz ${i+1} · Spieler B<input type="number" min="0" max="99" name="b${i}" placeholder="–"></label>`).join('')}</div>`}
function wire(){document.querySelectorAll('[data-player]').forEach(el=>{el.onclick=()=>{selected=el.dataset.player;render()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});if($('#back'))$('#back').onclick=()=>{selected=null;render()};if($('#format')){$('#format').onchange=setsUI;setsUI()}if($('#photoFile'))$('#photoFile').onchange=e=>{let file=e.target.files?.[0];if(!file)return;if(file.size>15*1024*1024){alert('Bitte ein Bild unter 15 MB auswählen.');e.target.value='';return}if(!file.type.startsWith('image/')){alert('Bitte eine Bilddatei auswählen.');return}let url=URL.createObjectURL(file);$('#cropImage').src=url;$('#cropModal').classList.remove('hidden');if(cropper)cropper.destroy();cropper=new Cropper($('#cropImage'),{aspectRatio:1,viewMode:1,dragMode:'move',autoCropArea:1,background:false,ready(){URL.revokeObjectURL(url)}})};if($('#cropZoomIn'))$('#cropZoomIn').onclick=()=>cropper?.zoom(.1);if($('#cropZoomOut'))$('#cropZoomOut').onclick=()=>cropper?.zoom(-.1);if($('#cropCancel'))$('#cropCancel').onclick=()=>{cropper?.destroy();cropper=null;pendingPhoto=null;$('#photoFile').value='';$('#cropModal').classList.add('hidden');$('#photoPreview').classList.add('hidden')};if($('#cropConfirm'))$('#cropConfirm').onclick=()=>{if(!cropper)return;let canvas=cropper.getCroppedCanvas({width:512,height:512,imageSmoothingQuality:'high'});canvas.toBlob(blob=>{if(!blob)return alert('Bild konnte nicht verarbeitet werden.');pendingPhoto=blob;$('#photoPreview').src=URL.createObjectURL(blob);$('#photoPreview').classList.remove('hidden');cropper.destroy();cropper=null;$('#cropModal').classList.add('hidden')},'image/webp',.88)};if($('#addPlayer'))$('#addPlayer').onsubmit=async e=>{e.preventDefault();let button=$('#savePlayer');button.disabled=true;button.textContent='Speichere …';let f=new FormData(e.target);let first_name=String(f.get('first_name')).trim(),last_name=String(f.get('last_name')).trim(),nickname=String(f.get('nickname')).trim();let height=String(f.get('height_cm')).trim();let photo_url=null,uploadedPath=null;try{if(!first_name||!last_name||!nickname)throw Error('Bitte alle Namensfelder ausfüllen.');if(pendingPhoto){uploadedPath=uid()+'.webp';let up=await db.storage.from('player-photos').upload(uploadedPath,pendingPhoto,{contentType:'image/webp',upsert:false});if(up.error)throw up.error;photo_url=db.storage.from('player-photos').getPublicUrl(uploadedPath).data.publicUrl}let {error}=await db.from('players').insert({name:nickname,first_name,last_name,nickname,nationality:String(f.get('nationality')),birth_date:f.get('birth_date')||null,height_cm:height?Number(height):null,playing_hand:String(f.get('playing_hand')),photo_url});if(error)throw error;pendingPhoto=null;await loadData();alert('Spieler erfolgreich angelegt!')}catch(err){if(uploadedPath)await db.storage.from('player-photos').remove([uploadedPath]);alert('Spieler konnte nicht gespeichert werden: '+err.message)}finally{if($('#savePlayer')){$('#savePlayer').disabled=false;$('#savePlayer').textContent='Spieler hinzufügen'}}};if($('#addMatch'))$('#addMatch').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),a=f.get('a'),b=f.get('b'),n=Number(f.get('format'));if(a===b)return alert('Bitte zwei unterschiedliche Spieler wählen.');let sets=[];for(let i=0;i<n;i++){let x=f.get('a'+i),y=f.get('b'+i);if(x===''&&y==='')continue;if(x===''||y==='')return alert('Bitte beide Werte eines Satzes eingeben.');let u=Number(x),v=Number(y);if(u===v)return alert('Ein Satz darf nicht unentschieden enden.');if(Math.max(u,v)<11||Math.abs(u-v)<2)return alert('Sätze müssen bis mindestens 11 und mit zwei Punkten Vorsprung gespielt werden.');sets.push([u,v])}let aw=sets.filter(s=>s[0]>s[1]).length,bw=sets.length-aw,need=Math.ceil(n/2);if(Math.max(aw,bw)!==need||sets.length!==aw+bw||sets.length>n)return alert('Bitte ein vollständiges Best-of-'+n+'-Ergebnis eingeben.');let {error}=await db.from('matches').insert({player1_id:a,player2_id:b,match_date:f.get('date'),best_of:n,sets,stage:'league'});if(error)return alert(error.message);await loadData()};document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=async()=>{if(confirm('Dieses Match wirklich löschen?')){let {error}=await db.from('matches').delete().eq('id',el.dataset.delete);if(error)return alert(error.message);await loadData()}});if($('#export'))$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='team-kalo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('#import'))$('#import').onchange=()=>alert('Import in die zentrale Datenbank ist noch nicht eingerichtet. Bitte JSON als Backup behalten.');if($('#login'))$('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await db.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(error){statusMessage=error.message;render()}};if($('#logout'))$('#logout').onclick=()=>db.auth.signOut()}
async function refreshAuth(){let {data:auth}=await db.auth.getSession();session=auth.session;isAdmin=false;if(session){let {data:rows,error}=await db.from('admins').select('user_id').eq('user_id',session.user.id).limit(1);isAdmin=!error&&rows?.length===1}render()}
async function loadData(){let [pr,mr]=await Promise.all([db.from('players').select('id,name,first_name,last_name,nickname,nationality,birth_date,height_cm,playing_hand,photo_url,active,created_at').order('created_at'),db.from('matches').select('id,player1_id,player2_id,match_date,best_of,sets,stage,created_at').order('created_at')]);if(pr.error||mr.error){statusMessage=(pr.error||mr.error).message;console.error(statusMessage);return alert('Daten konnten nicht geladen werden: '+statusMessage)}data.players=pr.data.map(p=>({id:p.id,name:p.name,first_name:p.first_name,last_name:p.last_name,nickname:p.nickname||p.name,nationality:p.nationality,birth_date:p.birth_date,height_cm:p.height_cm,playing_hand:p.playing_hand,photo:p.photo_url||''}));data.matches=mr.data.map(m=>({id:m.id,a:m.player1_id,b:m.player2_id,date:m.match_date,sets:m.sets,created:m.created_at,stage:m.stage}));render()}
(async()=>{await refreshAuth();await loadData();db.auth.onAuthStateChange(()=>{setTimeout(refreshAuth,0)});// Automatische Aktualisierung deaktiviert, damit Formulareingaben erhalten bleiben.
})();
</script></body></html>
