const SUPABASE_URL='https://wtqytkcbbysofiebakzd.supabase.co';const SUPABASE_KEY='sb_publishable_NFAhNLQ0aYAAOpVheW8eaA_tc4aS_xJ';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let session=null;let isAdmin=false;let statusMessage='';const KEY='team-kalo-v1';const sample={players:[],matches:[],venues:[],news:[],playoffs:[],phase:'league'};let data=structuredClone(sample);let tab='Übersicht';let selected=null;let editingMatchId=null;let editingVenueId=null;let venuePreviewObjectUrl=null;let editingNewsId=null;let generatedDraft=[];let generatedSettings=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{};const uid=()=>crypto.randomUUID();const displayName=p=>p?.nickname||p?.name||'Unbekannt';const photo=p=>p.photo||'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(displayName(p));const name=id=>displayName(data.players.find(p=>p.id===id));const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('de-DE'):'–';
const countryCodes='DE AT CH NL BE FR ES PT IT GB IE DK SE NO FI IS PL CZ SK HU SI HR BA RS ME AL GR TR UA RO BG LT LV EE LU MT CY US CA MX BR AR CL CO PE UY PY BO EC VE CR PA CU DO JM AU NZ JP CN KR IN ZA MA EG NG GH KE IL AE SA TH VN PH ID MY SG PK BD NP'.split(' ');
const countryNames=new Intl.DisplayNames(['de'],{type:'region'});
const flag=code=>code&&/^[A-Z]{2}$/.test(code)?String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0))):'🌍';
const countryOptions=countryCodes.map(code=>({code,label:flag(code)+' '+countryNames.of(code)})).sort((a,b)=>a.label.slice(5).localeCompare(b.label.slice(5),'de')).map(x=>`<option value="${x.code}">${esc(x.label)}</option>`).join('');
const handOptions=[['right','Rechtshänder'],['left','Linkshänder'],['both','Beidhändig'],['two_weak','2 schwache Hände']];
const handLabel=code=>handOptions.find(x=>x[0]===code)?.[1]||'–';
let pendingPhoto=null;let cropper=null;let editingPlayerId=null;

function completedLeagueMatches(){return data.matches.filter(m=>m.stage==='league'&&m.status==='completed'&&Array.isArray(m.sets)&&m.sets.length)}
function stats(){let map={};data.players.forEach(p=>map[p.id]={...p,w:0,l:0,played:0,setsWon:0,setsLost:0,pointsWon:0,pointsLost:0,form:[]});completedLeagueMatches().sort((a,b)=>(a.scheduled_at||a.date||'').localeCompare(b.scheduled_at||b.date||'')||(a.created||'').localeCompare(b.created||'')).forEach(m=>{let a=map[m.a],b=map[m.b];if(!a||!b)return;let aw=0,bw=0;for(let pair of m.sets){let x=Number(pair[0]),y=Number(pair[1]);if(!Number.isFinite(x)||!Number.isFinite(y))return;a.pointsWon+=x;a.pointsLost+=y;b.pointsWon+=y;b.pointsLost+=x;if(x>y)aw++;else if(y>x)bw++}if(aw===bw)return;a.setsWon+=aw;a.setsLost+=bw;b.setsWon+=bw;b.setsLost+=aw;a.played++;b.played++;if(aw>bw){a.w++;b.l++;a.form.push('W');b.form.push('L')}else{b.w++;a.l++;b.form.push('W');a.form.push('L')}});return Object.values(map).sort((a,b)=>b.w-a.w||((b.setsWon-b.setsLost)-(a.setsWon-a.setsLost))||((b.pointsWon-b.pointsLost)-(a.pointsWon-a.pointsLost))||b.setsWon-a.setsWon||displayName(a).localeCompare(displayName(b)))}
function formBadges(p){return `<span class="form-strip" aria-label="Letzte Ergebnisse">${(p.form||[]).slice(-5).map(x=>`<span class="form-badge ${x==='W'?'win':'loss'}">${x}</span>`).join('')||'<span class="muted">–</span>'}</span>`}

function setupAdminAccordions(){
  if(tab!=='Verwaltung'||!isAdmin)return;
  const root=document.querySelector('#content');if(!root)return;
  const panels=[...root.querySelectorAll(':scope > .panel')];
  panels.forEach((panel,i)=>{
    if(panel.id==='resultPanel')return;
    const heading=panel.querySelector(':scope > h3');
    if(!heading)return;
    const details=document.createElement('details');details.className='panel admin-accordion';
    const summary=document.createElement('summary');summary.textContent=heading.textContent.trim();
    const body=document.createElement('div');body.className='admin-accordion-body';
    let node=heading.nextSibling;
    while(node){const next=node.nextSibling;body.appendChild(node);node=next;}
    heading.remove();details.append(summary,body);
    if(i===0){panel.after(details);}
    else panel.replaceWith(details);
  });
  // Bearbeiten/Ergebnis-Eingabe öffnet automatisch den passenden Bereich.
  root.addEventListener('click',e=>{
    const btn=e.target.closest('button');if(!btn)return;
    let target=null;
    if(btn.matches('[data-edit-player]'))target='#addPlayer';
    else if(btn.matches('[data-edit-match]'))target='#matchForm';
    else if(btn.matches('[data-edit-venue]'))target='#venueForm';
    else if(btn.matches('[data-edit-news]'))target='#newsForm';
    else if(btn.matches('[data-result-match]'))target='#resultPanel';
    if(!target)return;
    const section=root.querySelector(target)?.closest('details');
    if(section)section.open=true;
  },true);
}

function navigate(t){tab=t;selected=null;render()}function render(){let tabs=['Übersicht','Tabelle','Spieler','Matches','Spielorte','Rekorde','Head-to-Head','Playoffs','Verwaltung'];$('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));$('#content').innerHTML=({Übersicht:overview,Tabelle:ranking,Spieler:players,Matches:matches,Spielorte:venuesPage,Rekorde:recordsPage,'Head-to-Head':headToHeadPage,Playoffs:playoffs,Verwaltung:admin})[tab]();setupAdminAccordions();wire()}
function overview(){let s=stats(),recent=[...data.matches].filter(m=>m.status==='completed').reverse().slice(0,5),upcoming=data.matches.filter(m=>m.status==='scheduled').sort((a,b)=>(a.scheduled_at||a.date).localeCompare(b.scheduled_at||b.date)).slice(0,5);return `${newsFeed()}<div class="grid"><div class="panel"><small>SPIELER</small><h1>${data.players.length}</h1></div><div class="panel"><small>GESPIELTE MATCHES</small><h1>${data.matches.filter(m=>m.status==='completed').length}</h1></div><div class="panel"><small>TABELLENFÜHRER</small><h1>${esc(s[0]?displayName(s[0]):'–')}</h1></div></div><div class="panel"><h2>Nächste Matches</h2>${matchList(upcoming)}</div><div class="panel"><h2>Aktuelle Tabelle</h2>${table(s.slice(0,5))}</div><div class="panel"><h2>Letzte Ergebnisse</h2>${matchList(recent)}</div>`}

function table(s){return `<div class="table-scroll"><table><thead><tr><th>#</th><th>Spieler</th><th>Sp</th><th>S</th><th>N</th><th>Sätze</th><th>Punkte</th><th>Form</th></tr></thead><tbody>${s.map((p,i)=>`<tr><td>${i+1}</td><td><span class="player-inline"><img class="avatar" src="${esc(photo(p))}" alt=""><span class="player-name">${esc(displayName(p))} <span class="country-flag">${flag(p.nationality)}</span></span></span></td><td>${p.played}</td><td>${p.w}</td><td>${p.l}</td><td>${p.setsWon}:${p.setsLost}</td><td>${p.pointsWon}:${p.pointsLost}</td><td>${formBadges(p)}</td></tr>`).join('')}</tbody></table></div>`}
function ranking(){return `<div class="panel"><h2>Ligatabelle</h2><p class="muted">Sortierung: Siege → Satzdifferenz → Punktedifferenz → gewonnene Sätze. Nur abgeschlossene Ligamatches zählen.</p>${table(stats())}</div>`}

function players(){if(selected){let p=stats().find(x=>x.id===selected);if(!p)return '<p>Spieler nicht gefunden.</p>';let detail=(label,value)=>`<div><small>${label}</small><strong>${esc(value||'–')}</strong></div>`;return `<button id="back">← Alle Spieler</button><div class="panel"><div class="profile-top"><img src="${esc(photo(p))}" alt="Profilbild"><div><h2 style="margin-bottom:6px">${esc(displayName(p))}</h2><div class="muted">${esc([p.first_name,p.last_name].filter(Boolean).join(' ')||p.name)}</div><p>${flag(p.nationality)} ${esc(p.nationality?countryNames.of(p.nationality):'Nationalität unbekannt')}</p><strong>${esc(record(p))}</strong>${p.active===false?' <span class="tag">Inaktiv</span>':''}</div></div><div class="profile-details">${detail('Vorname',p.first_name)}${detail('Nachname',p.last_name)}${detail('Spitzname',displayName(p))}${detail('Geburtsdatum',p.birth_date?fmt(p.birth_date):'–')}${detail('Größe',p.height_cm?p.height_cm+' cm':'–')}${detail('Spielhand',handLabel(p.playing_hand))}${extraFields(p).map(f=>detail(esc(f.label),f.value)).join('')}</div><h3>Letzte 5 Matches · Formkurve</h3>${formBadges(p)}<button type="button" data-h2h-player="${esc(p.id)}">⚔️ Head-to-Head vergleichen</button><h3>Matchhistorie</h3>${matchList(data.matches.filter(m=>m.a===p.id||m.b===p.id).reverse())}</div>`}return `<h2>Spielerprofile</h2><div class="grid">${stats().map(p=>`<div class="panel player player-card" data-player="${esc(p.id)}" role="button" tabindex="0"><img src="${esc(photo(p))}" alt="Profilbild ${esc(displayName(p))}"><span class="player-name"><strong>${esc(displayName(p))}</strong> <span class="country-flag" aria-label="Nationalität">${flag(p.nationality)}</span></span>${p.active===false?'<span class="inactive-mark">Inaktiv</span>':''}</div>`).join('')||'<p class="muted">Noch keine Spieler vorhanden.</p>'}</div>`}
function extraFields(p){return Array.isArray(p?.custom_fields)?p.custom_fields.filter(x=>x&&typeof x.label==='string'&&x.label.trim()):[]}
function customFieldRow(label='',value=''){const row=document.createElement('div');row.className='custom-field-row';row.innerHTML=`<label>Bezeichnung<input class="extra-label" maxlength="60" placeholder="z. B. Gewicht" value="${esc(label)}"></label><label>Wert<input class="extra-value" maxlength="200" placeholder="z. B. 83 kg" value="${esc(value)}"></label><button type="button" class="remove-extra">Entfernen</button>`;row.querySelector('.remove-extra').onclick=()=>row.remove();return row}
function fillCustomFields(items=[]){const box=$('#customFieldsList');if(!box)return;box.replaceChildren();items.forEach(item=>box.append(customFieldRow(item.label||'',item.value||'')))}
function readCustomFields(){return [...document.querySelectorAll('#customFieldsList .custom-field-row')].map(row=>({label:row.querySelector('.extra-label').value.trim(),value:row.querySelector('.extra-value').value.trim()})).filter(x=>x.label||x.value).map(x=>{if(!x.label)throw Error('Bitte für jedes Zusatzfeld eine Bezeichnung eingeben.');return x})}
const venueName=id=>data.venues.find(v=>v.id===id)?.name||'Ort nicht angegeben';
const localDateTime=s=>s?fmt(s.slice(0,10)):'Termin offen';

function recordsPage(){let s=stats(),finished=completedLeagueMatches(),chron=[...finished].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||'').localeCompare(b.created||''));let streaks={};for(let m of chron){let aw=m.sets.filter(x=>x[0]>x[1]).length,bw=m.sets.length-aw;if(aw===bw)continue;for(let [id,result] of [[m.a,aw>bw?'W':'L'],[m.b,bw>aw?'W':'L']]){let v=streaks[id]||(streaks[id]={last:'',length:0,bestW:0,bestL:0});v.length=v.last===result?v.length+1:1;v.last=result;if(result==='W')v.bestW=Math.max(v.bestW,v.length);else v.bestL=Math.max(v.bestL,v.length)}}let top=(fn,positive=false)=>{let arr=s.map(p=>({p,v:fn(p)})).sort((a,b)=>b.v-a.v);return arr.length&&(positive?arr[0].v>0:true)?arr[0]:null};let cards=[['🏆 Meiste Siege',top(p=>p.w,true)],['🔥 Längste Siegesserie',top(p=>streaks[p.id]?.bestW||0,true)],['🥶 Längste Niederlagenserie',top(p=>streaks[p.id]?.bestL||0,true)],['🎯 Meiste Spielpunkte',top(p=>p.pointsWon,true)],['📈 Beste Satzdifferenz',top(p=>p.setsWon-p.setsLost)],['🏓 Meiste gewonnene Sätze',top(p=>p.setsWon,true)],['📅 Meiste Matches',top(p=>p.played,true)]];let close=finished.map(m=>({m,margin:Math.abs(m.sets.filter(x=>x[0]>x[1]).length-m.sets.filter(x=>x[1]>x[0]).length),points:m.sets.reduce((v,x)=>v+Math.abs(x[0]-x[1]),0)})).sort((a,b)=>a.margin-b.margin||a.points-b.points)[0];return `<h2>🏅 Kalo Record Book</h2><p class="muted">Alle Rekorde werden automatisch aus abgeschlossenen Ligamatches berechnet.</p><div class="grid">${cards.map(([label,item])=>`<div class="record-card"><h3>${label}</h3><strong>${item?item.v:'–'}</strong><p>${item?esc(displayName(item.p)):'Noch kein Rekord'}</p></div>`).join('')}${close?`<div class="record-card"><h3>⚡ Knappstes Match (Sätze / Punktabstände)</h3><strong>${esc(name(close.m.a))} vs. ${esc(name(close.m.b))}</strong><p>${close.m.sets.map(x=>x.join(':')).join(' · ')}</p></div>`:''}</div>`}

function pairBalance(matches,ids){let counts={};for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)counts[pairKey(ids[i],ids[j])]=0;for(let m of matches){let k=pairKey(m.a,m.b);if(k in counts)counts[k]++}let v=Object.values(counts);return {min:Math.min(...v),max:Math.max(...v),counts}}

function opponentMatrix(){let players=data.players;if(players.length<2)return '<p class="muted">Noch zu wenige Spieler.</p>';let completed=data.matches.filter(m=>m.stage==='league'&&m.status==='completed'),planned=data.matches.filter(m=>m.stage==='league'&&m.status==='scheduled');let counts=(arr,a,b)=>arr.filter(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a)).length;return `<div class="table-scroll"><table><thead><tr><th>Spieler</th>${players.map(p=>`<th title="${esc(displayName(p))}">${esc(displayName(p))}</th>`).join('')}</tr></thead><tbody>${players.map(p=>`<tr><th>${esc(displayName(p))}</th>${players.map(q=>{if(p.id===q.id)return '<td>–</td>';let c=counts(completed,p.id,q.id),v=counts(planned,p.id,q.id);return `<td title="${c} gespielt, ${v} geplant"><strong>${c}</strong>${v?` <small>(+${v})</small>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="form-help">Fette Zahl = gespielt; (+Zahl) = zusätzlich geplant.</p>`}

function dateISO(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function createSchedule(opts){
 const ids=opts.players.filter(id=>data.players.some(p=>p.id===id&&p.active!==false)),n=ids.length,total=opts.total,slots=[];
 if(n<2)throw Error('Bitte mindestens zwei anwesende Spieler auswählen.');
 if(!Number.isInteger(total)||total<1||total>300)throw Error('Bitte eine gültige Anzahl Matches wählen.');
 if(!opts.days.length)throw Error('Bitte mindestens einen Wochentag auswählen.');
 const start=new Date(opts.start+'T12:00:00');if(isNaN(start))throw Error('Ungültiges Startdatum.');
 for(let i=0;i<opts.weeks*7;i++){let d=new Date(start);d.setDate(start.getDate()+i);if(opts.days.includes(d.getDay()))slots.push({date:dateISO(d),week:Math.floor(i/7)})}
 if(!slots.length)throw Error('Keine erlaubten Spieltage im Zeitraum.');
 const old=data.matches.filter(m=>m.stage==='league'&&m.status!=='cancelled'),pairCounts={},weekCounts={},dayCounts={},playerTotals={};
 for(let m of old){let key=pairKey(m.a,m.b);pairCounts[key]=(pairCounts[key]||0)+1;let date=m.date||m.scheduled_at?.slice(0,10);if(!date)continue;if(m.status==='scheduled')dayCounts[date]=(dayCounts[date]||0)+1;let offset=Math.floor((new Date(date+'T12:00:00')-start)/604800000);if(offset>=0&&offset<opts.weeks)for(let id of [m.a,m.b])weekCounts[offset+'|'+id]=(weekCounts[offset+'|'+id]||0)+1}
 if(slots.reduce((sum,x)=>sum+Math.max(0,opts.maxDay-(dayCounts[x.date]||0)),0)<total)throw Error('Nicht genügend freie Tagesplätze für '+total+' neue Matches (maximal '+opts.maxDay+' pro Tag; bereits angesetzte Matches belegen Plätze).');
 const available=ids.reduce((sum,id)=>sum+Array.from({length:opts.weeks},(_,w)=>Math.max(0,opts.maxWeek-(weekCounts[w+'|'+id]||0))).reduce((a,b)=>a+b,0),0);
 if(available<total*2)throw Error('Das Wochenlimit lässt nur '+Math.floor(available/2)+' zusätzliche Matches zu. Bitte Wochenlimit erhöhen oder Zeitraum verlängern.');
 const seed={pairs:{...pairCounts},weeks:{...weekCounts},days:{...dayCounts},totals:Object.fromEntries(ids.map(id=>[id,0])),games:[],penalty:0};
 let beam=[seed],beamWidth=35;
 for(let step=0;step<total;step++){
   let next=[];
   for(let st of beam){let options=[];
     for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
       let a=ids[i],b=ids[j],repeat=st.pairs[pairKey(a,b)]||0;
       for(let slot of slots){let d=slot.date,w=slot.week;
         if((st.days[d]||0)>=opts.maxDay||(st.weeks[w+'|'+a]||0)>=opts.maxWeek||(st.weeks[w+'|'+b]||0)>=opts.maxWeek)continue;
         let ta=st.totals[a]||0,tb=st.totals[b]||0;
         // First balance opponents, then distribute individual workloads fairly.
         let score=repeat*10000+(ta+tb)*900+Math.abs(ta-tb)*160+(st.days[d]||0)*4+w*.02;
         options.push({a,b,slot,score});
       }
     }
     options.sort((a,b)=>a.score-b.score||a.slot.date.localeCompare(b.slot.date));
     for(let choice of options.slice(0,Math.max(12,Math.ceil(beamWidth/2)))){
       let {a,b,slot}=choice,d=slot.date,w=slot.week,key=pairKey(a,b);
       let ns={pairs:{...st.pairs},weeks:{...st.weeks},days:{...st.days},totals:{...st.totals},games:[...st.games,{a,b,date:d,venue_id:opts.venue,best_of:opts.best_of}],penalty:st.penalty+choice.score};
       ns.pairs[key]=(ns.pairs[key]||0)+1;ns.days[d]=(ns.days[d]||0)+1;ns.totals[a]++;ns.totals[b]++;
       for(let id of [a,b])ns.weeks[w+'|'+id]=(ns.weeks[w+'|'+id]||0)+1;
       next.push(ns);
     }
   }
   if(!next.length)throw Error('Unter diesen Vorgaben konnten nur '+step+' von '+total+' Matches verteilt werden. Erhöhe das Wochenlimit oder erlaube weitere Tage.');
   next.sort((a,b)=>a.penalty-b.penalty);let seen=new Set();beam=[];
   for(let st of next){let sig=ids.map(id=>st.totals[id]).join(',')+'|'+Object.keys(st.pairs).sort().map(key=>st.pairs[key]).join(',')+'|'+st.games.at(-1).date;if(seen.has(sig))continue;seen.add(sig);beam.push(st);if(beam.length>=beamWidth)break}
 }
 let best=beam.sort((a,b)=>{let va=Object.values(a.totals),vb=Object.values(b.totals);return (Math.max(...va)-Math.min(...va))-(Math.max(...vb)-Math.min(...vb))||a.penalty-b.penalty})[0];
 return best.games.sort((a,b)=>a.date.localeCompare(b.date));
}

function collectMatchSets(form,m){let sets=[],wins=[0,0],need=Math.ceil(Number(m.best_of)/2),ended=false,seenBlank=false;for(let i=0;i<Number(m.best_of);i++){let a=String(form.get('a'+i)??''),b=String(form.get('b'+i)??'');if(a===''&&b===''){seenBlank=true;continue}if(a===''||b==='')throw Error('Bitte beide Punktzahlen für Satz '+(i+1)+' eintragen.');if(seenBlank)throw Error('Bitte keine Sätze überspringen.');if(ended)throw Error('Nach dem entscheidenden Satz gibt es keine weiteren Sätze.');let x=Number(a),y=Number(b);if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>99||y>99||Math.max(x,y)<11||Math.abs(x-y)<2||(Math.max(x,y)>11&&Math.abs(x-y)!==2))throw Error('Satz '+(i+1)+' ist ungültig: mindestens 11 Punkte, genau 2 Punkte Vorsprung bei Verlängerung.');sets.push([x,y]);wins[x>y?0:1]++;if(Math.max(...wins)===need)ended=true}if(!ended)throw Error('Das Match ist noch nicht entschieden: '+need+' Gewinnsätze erforderlich.');return {sets,wins}}

function openResult(m){let panel=$('#resultPanel');panel.classList.remove('hidden');$('#resultMatchLabel').textContent=name(m.a)+' vs. '+name(m.b)+' · Best of '+m.best_of;let f=$('#resultForm');f.elements.namedItem('match_id').value=m.id;let n=Number(m.best_of||3);$('#resultSets').innerHTML=resultFields(m);panel.scrollIntoView({behavior:'smooth',block:'start'})}
document.querySelectorAll('[data-public-result]').forEach(el=>el.onclick=()=>{let m=data.matches.find(x=>x.id===el.dataset.publicResult);if(!m||m.status!=='scheduled')return;let panel=$('#publicResultPanel');if(!panel)return;panel.classList.remove('hidden');$('#publicResultLabel').textContent=name(m.a)+' vs. '+name(m.b)+' · Best of '+m.best_of;$('#publicResultForm').elements.namedItem('match_id').value=m.id;$('#publicResultSets').innerHTML=resultFields({...m,sets:[]});panel.scrollIntoView({behavior:'smooth',block:'start'})});
if($('#publicResultClose'))$('#publicResultClose').onclick=()=>$('#publicResultPanel').classList.add('hidden');
if($('#publicResultForm'))$('#publicResultForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),m=data.matches.find(x=>x.id===f.get('match_id'));if(!m||m.status!=='scheduled')return alert('Dieses Match ist nicht mehr offen.');let result;try{result=collectMatchSets(f,m)}catch(err){return alert(err.message)}if(!confirm('Ergebnis '+result.wins.join(':')+' verbindlich speichern?'))return;let btn=$('#publicResultSave');btn.disabled=true;try{let {error}=await db.rpc('submit_match_result_with_pin',{p_match_id:m.id,p_pin:String(f.get('pin')),p_sets:result.sets});if(error)throw error;await loadData();alert('Ergebnis gespeichert!')}catch(err){alert('Ergebnis konnte nicht gespeichert werden: '+err.message)}finally{if($('#publicResultSave'))$('#publicResultSave').disabled=false}};
document.querySelectorAll('[data-result-match]').forEach(el=>el.onclick=()=>{let m=data.matches.find(x=>x.id===el.dataset.resultMatch);if(m)openResult(m)});
if($('#closeResult'))$('#closeResult').onclick=()=>$('#resultPanel').classList.add('hidden');
if($('#resultForm'))$('#resultForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),m=data.matches.find(x=>x.id===f.get('match_id'));if(!m)return;let sets=[],wins=[0,0],need=Math.ceil(m.best_of/2),ended=false,seenBlank=false;for(let i=0;i<m.best_of;i++){let a=String(f.get('a'+i)),b=String(f.get('b'+i));if(a===''&&b===''){seenBlank=true;continue}if(a===''||b==='')return alert('Bitte immer beide Punktzahlen eines Satzes eintragen.');if(seenBlank)return alert('Bitte die Sätze ohne Lücken eintragen.');if(ended)return alert('Nach dem entscheidenden Satz dürfen keine weiteren Sätze gespielt werden.');let x=Number(a),y=Number(b);if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||Math.max(x,y)<11||Math.abs(x-y)<2||(Math.max(x,y)>11&&Math.abs(x-y)!==2))return alert('Ungültiger Satz '+(i+1)+': mindestens 11 Punkte und 2 Punkte Vorsprung.');sets.push([x,y]);wins[x>y?0:1]++;if(Math.max(...wins)===need)ended=true}if(!ended)return alert('Das Match ist noch nicht entschieden. Es werden '+need+' Gewinnsätze benötigt.');if(!confirm('Ergebnis '+wins.join(':')+' verbindlich speichern? Die Ligatabelle wird aktualisiert.'))return;let {error}=await db.from('matches').update({sets,status:'completed'}).eq('id',m.id);if(error)return alert('Ergebnis konnte nicht gespeichert werden: '+error.message);await loadData();alert('Ergebnis gespeichert!')};
for(let [selector,status,question] of [['data-cancel-match','cancelled','Match wirklich absagen?'],['data-restore-match','scheduled','Match wieder aktivieren?']])document.querySelectorAll('['+selector+']').forEach(el=>el.onclick=async()=>{if(!confirm(question))return;let {error}=await db.from('matches').update({status}).eq('id',el.getAttribute(selector));if(error)return alert(error.message);await loadData()});
if($('#venueForm')){const venueForm=$('#venueForm');const preview=$('#venueImagePreview');const showVenuePreview=url=>{if(venuePreviewObjectUrl){URL.revokeObjectURL(venuePreviewObjectUrl);venuePreviewObjectUrl=null}if(url){preview.src=url;preview.classList.remove('hidden')}else{preview.removeAttribute('src');preview.classList.add('hidden')}};$('#venueImageFile').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')&&!/\.(heic|heif)$/i.test(file.name)){e.target.value='';return alert('Bitte eine Bilddatei auswählen.')}venuePreviewObjectUrl=URL.createObjectURL(file);preview.src=venuePreviewObjectUrl;preview.classList.remove('hidden')};venueForm.onsubmit=async e=>{e.preventDefault();if(!isAdmin)return alert('Nur Admins dürfen Spielorte bearbeiten.');const button=$('#saveVenue');button.disabled=true;button.textContent='Speichere …';let uploadedPath=null;try{let f=new FormData(e.target),id=String(f.get('venue_id')||''),file=f.get('venue_image_file'),payload={name:String(f.get('name')).trim(),city:String(f.get('city')).trim()||null,description:String(f.get('description')).trim()||null,image_url:id?(data.venues.find(v=>v.id===id)?.image_url||null):null};if(file instanceof File&&file.size){if(file.size>20*1024*1024)throw Error('Bild ist zu groß (maximal 20 MB).');const blob=await compressVenueImage(file);uploadedPath=uid()+'.jpg';let up=await db.storage.from('venue-photos').upload(uploadedPath,blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;payload.image_url=db.storage.from('venue-photos').getPublicUrl(uploadedPath).data.publicUrl}let {error}=id?await db.from('venues').update(payload).eq('id',id):await db.from('venues').insert(payload);if(error)throw error;showVenuePreview(null);await loadData();alert(id?'Spielort aktualisiert!':'Spielort angelegt!')}catch(err){if(uploadedPath)await db.storage.from('venue-photos').remove([uploadedPath]);alert('Spielort konnte nicht gespeichert werden: '+err.message)}finally{const btn=$('#saveVenue');if(btn){btn.disabled=false;btn.textContent='Spielort hinzufügen'}}};$('#resetVenue').onclick=()=>{editingVenueId=null;venueForm.reset();venueForm.elements.namedItem('venue_id').value='';showVenuePreview(null);$('#saveVenue').textContent='Spielort hinzufügen';$('#resetVenue').classList.add('hidden')}}
document.querySelectorAll('[data-edit-venue]').forEach(el=>el.onclick=()=>{let v=data.venues.find(x=>x.id===el.dataset.editVenue),f=$('#venueForm');if(!v||!f)return;f.elements.namedItem('venue_id').value=v.id;for(let key of ['name','city','description'])f.elements.namedItem(key).value=v[key]||'';f.elements.namedItem('venue_image_file').value='';if(venuePreviewObjectUrl){URL.revokeObjectURL(venuePreviewObjectUrl);venuePreviewObjectUrl=null}let preview=$('#venueImagePreview');if(v.image_url){preview.src=v.image_url;preview.classList.remove('hidden')}else{preview.removeAttribute('src');preview.classList.add('hidden')}$('#saveVenue').textContent='Änderungen speichern';$('#resetVenue').classList.remove('hidden');f.scrollIntoView({behavior:'smooth',block:'start'})});
document.querySelectorAll('[data-toggle-venue]').forEach(el=>el.onclick=async()=>{let v=data.venues.find(x=>x.id===el.dataset.toggleVenue);if(!v||!confirm('Spielort '+(v.active?'deaktivieren':'aktivieren')+'?'))return;let {error}=await db.from('venues').update({active:!v.active}).eq('id',v.id);if(error)return alert(error.message);await loadData()});
if($('#export'))$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='team-kalo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('#import'))$('#import').onchange=()=>alert('Import in die zentrale Datenbank ist noch nicht eingerichtet. Bitte JSON als Backup behalten.');if($('#login'))$('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await db.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(error){statusMessage=error.message;render()}};if($('#logout'))$('#logout').onclick=()=>db.auth.signOut();wireExtras()}
async function refreshAuth(){let {data:auth}=await db.auth.getSession();session=auth.session;isAdmin=false;if(session){let {data:rows,error}=await db.from('admins').select('user_id').eq('user_id',session.user.id).limit(1);isAdmin=!error&&rows?.length===1}render()}
async function loadData(){let [pr,mr,vr,nr]=await Promise.all([db.from('players').select('id,name,first_name,last_name,nickname,nationality,birth_date,height_cm,playing_hand,custom_fields,photo_url,active,created_at').order('created_at'),db.from('matches').select('id,player1_id,player2_id,match_date,scheduled_at,venue_id,status,best_of,sets,stage,created_at').order('created_at'),db.from('venues').select('id,name,city,description,image_url,active,created_at').order('name'),db.from('news').select('id,title,body,category,created_at').order('created_at',{ascending:false})]);if(pr.error||mr.error||vr.error||nr.error){statusMessage=(pr.error||mr.error||vr.error||nr.error).message;console.error(statusMessage);return alert('Daten konnten nicht geladen werden: '+statusMessage+' (SQL-Migration bereits ausgeführt?)')}data.players=pr.data.map(p=>({active:p.active!==false,id:p.id,name:p.name,first_name:p.first_name,last_name:p.last_name,nickname:p.nickname||p.name,nationality:p.nationality,birth_date:p.birth_date,height_cm:p.height_cm,playing_hand:p.playing_hand,custom_fields:p.custom_fields||[],photo:p.photo_url||''}));data.matches=mr.data.map(m=>({id:m.id,a:m.player1_id,b:m.player2_id,date:m.match_date,scheduled_at:m.scheduled_at,venue_id:m.venue_id,status:m.status||'completed',best_of:m.best_of||3,sets:m.sets||[],created:m.created_at,stage:m.stage}));data.venues=vr.data;data.news=nr.data;render()}
(async()=>{await refreshAuth();await loadData();db.auth.onAuthStateChange(()=>{setTimeout(refreshAuth,0)});// Automatische Aktualisierung deaktiviert, damit Formulareingaben erhalten bleiben.
})();
</script></body></html>
