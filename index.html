<!doctype html><html lang="de"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Kalo | Pickleball League</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f4f4f4;background:#101820}*{box-sizing:border-box}body{margin:0}header{background:#192733;border-bottom:1px solid #35434c;padding:16px 5%;display:flex;align-items:center;gap:16px}header img{height:75px;width:75px;object-fit:contain;border-radius:12px}h1{margin:0;font-size:clamp(22px,4vw,38px)}small,.muted{color:#aab8c3}main{max-width:1100px;margin:auto;padding:25px 18px 80px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tabs button,button{background:#2b4353;color:white;border:1px solid #547084;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:650}.tabs button.active,button.primary{background:#eeb64a;color:#151c23;border-color:#eeb64a}.panel{background:#1a2935;border:1px solid #324451;border-radius:15px;padding:20px;margin:15px 0}h2{margin:0 0 16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #344653}th{color:#b9c6cd;font-size:13px}td:last-child,th:last-child{text-align:right}.avatar{width:40px;height:40px;object-fit:cover;border-radius:50%;background:#364958;vertical-align:middle;margin-right:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.player{display:flex;align-items:center;gap:10px;cursor:pointer}.player img{width:62px;height:62px;object-fit:cover;border-radius:50%;background:#344654}.match{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #344653;padding:14px 0}.match:last-child{border:0}.score{font-size:22px;font-weight:800;color:#eeb64a}input,select{width:100%;padding:11px;background:#101b24;color:white;border:1px solid #526574;border-radius:8px;margin:6px 0 14px}label{font-size:14px;color:#cbd7dc}form{max-width:650px}.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.note{background:#263b48;border-left:3px solid #eeb64a;padding:12px;border-radius:5px}.hidden{display:none}.tag{display:inline-block;border-radius:20px;background:#334b59;padding:5px 10px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}a{color:#f4c66b}@media(max-width:500px){th,td{padding:10px 3px;font-size:13px}.avatar{width:30px;height:30px;margin-right:5px}.panel{padding:14px}}

.player-card{flex-direction:column;text-align:center;justify-content:center;min-height:170px;transition:transform .15s,border-color .15s}.player-card:hover{transform:translateY(-3px);border-color:#eeb64a}.player-card img{width:94px;height:94px}.profile-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.profile-top img{width:130px;height:130px;object-fit:cover;border-radius:50%;background:#344654}.profile-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.profile-details>div{background:#223543;padding:14px;border-radius:10px}.profile-details small{display:block;margin-bottom:5px}.crop-overlay.hidden{display:none}.crop-overlay{position:fixed;inset:0;z-index:20;background:#000c;display:flex;align-items:center;justify-content:center;padding:15px}.crop-box{background:#1a2935;padding:20px;border-radius:16px;width:min(95vw,520px)}.crop-stage{height:330px;background:#101820;overflow:hidden}.crop-stage img{display:block;max-width:100%}.crop-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#344654}.form-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}.error-msg{color:#ff9d9d}.form-help{font-size:12px;color:#aab8c3;margin:-8px 0 12px}
.inactive-mark{font-size:12px;color:#f4c66b}.manage-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #344653}.manage-row img{width:48px;height:48px;border-radius:50%;object-fit:cover}.manage-row .grow{flex:1}.player-inline{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}.player-inline .avatar{margin-right:0;flex-shrink:0}.player-name{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.country-flag{font-size:1.15em;line-height:1;white-space:nowrap}.match-card{border-bottom:1px solid #344653;padding:16px 0}.match-card:last-child{border-bottom:0}.match-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.match-players{font-size:18px;font-weight:700;margin:10px 0}.match-meta{color:#aab8c3;font-size:13px}.match-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.venue-card{display:flex;gap:14px;align-items:center}.venue-card img{width:100px;height:75px;object-fit:cover;border-radius:9px}.status-pill{border-radius:20px;padding:4px 9px;background:#344b59;font-size:12px}.status-pill.done{background:#2d5948}.status-pill.cancelled{background:#63434b}.field-note{color:#aab8c3;font-size:12px;margin-top:-8px}.match-result-row{display:grid;grid-template-columns:75px 1fr 1fr;gap:12px;align-items:center}.match-result-row input{margin:5px 0}.admin-subsection{margin-top:20px;border-top:1px solid #344653;padding-top:16px}.table-scroll{overflow-x:auto}.table-scroll table{min-width:740px}.form-strip{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}.form-badge{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-size:12px;font-weight:800}.form-badge.win{background:#16834b}.form-badge.loss{background:#a83b45}.profile-top strong{line-height:1.7}.table-scroll td:last-child,.table-scroll th:last-child{text-align:left}</style></head><body><header><img src="assets/logo.png" alt="Team Kalo Logo"><div><h1>TEAM KALO</h1><div class="muted">PICKLEBALL LEAGUE · SAISON 2026/27</div><small>Euregio-Sporthalle · Emsdetten</small></div></header><main><div class="tabs" id="tabs"></div><div id="content"></div></main><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"><script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL='https://wtqytkcbbysofiebakzd.supabase.co';const SUPABASE_KEY='sb_publishable_NFAhNLQ0aYAAOpVheW8eaA_tc4aS_xJ';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let session=null;let isAdmin=false;let statusMessage='';const KEY='team-kalo-v1';const sample={players:[],matches:[],venues:[],playoffs:[],phase:'league'};let data=structuredClone(sample);let tab='Übersicht';let selected=null;let editingMatchId=null;let editingVenueId=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{};const uid=()=>crypto.randomUUID();const displayName=p=>p?.nickname||p?.name||'Unbekannt';const photo=p=>p.photo||'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(displayName(p));const name=id=>displayName(data.players.find(p=>p.id===id));const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('de-DE'):'–';
const countryCodes='DE AT CH NL BE FR ES PT IT GB IE DK SE NO FI IS PL CZ SK HU SI HR BA RS ME AL GR TR UA RO BG LT LV EE LU MT CY US CA MX BR AR CL CO PE UY PY BO EC VE CR PA CU DO JM AU NZ JP CN KR IN ZA MA EG NG GH KE IL AE SA TH VN PH ID MY SG PK BD NP'.split(' ');
const countryNames=new Intl.DisplayNames(['de'],{type:'region'});
const flag=code=>code&&/^[A-Z]{2}$/.test(code)?String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0))):'🌍';
const countryOptions=countryCodes.map(code=>({code,label:flag(code)+' '+countryNames.of(code)})).sort((a,b)=>a.label.slice(5).localeCompare(b.label.slice(5),'de')).map(x=>`<option value="${x.code}">${esc(x.label)}</option>`).join('');
const handOptions=[['right','Rechtshänder'],['left','Linkshänder'],['both','Beidhändig'],['two_weak','2 schwache Hände']];
const handLabel=code=>handOptions.find(x=>x[0]===code)?.[1]||'–';
let pendingPhoto=null;let cropper=null;let editingPlayerId=null;

function completedLeagueMatches(){return data.matches.filter(m=>m.stage==='league'&&m.status==='completed'&&Array.isArray(m.sets)&&m.sets.length)}
function stats(){let map={};data.players.forEach(p=>map[p.id]={...p,w:0,l:0,played:0,setsWon:0,setsLost:0,pointsWon:0,pointsLost:0,form:[]});completedLeagueMatches().sort((a,b)=>(a.scheduled_at||a.date||'').localeCompare(b.scheduled_at||b.date||'')||(a.created||'').localeCompare(b.created||'')).forEach(m=>{let a=map[m.a],b=map[m.b];if(!a||!b)return;let aw=0,bw=0;for(let pair of m.sets){let x=Number(pair[0]),y=Number(pair[1]);if(!Number.isFinite(x)||!Number.isFinite(y))return;a.pointsWon+=x;a.pointsLost+=y;b.pointsWon+=y;b.pointsLost+=x;if(x>y)aw++;else if(y>x)bw++}if(aw===bw)return;a.setsWon+=aw;a.setsLost+=bw;b.setsWon+=bw;b.setsLost+=aw;a.played++;b.played++;if(aw>bw){a.w++;b.l++;a.form.push('W');b.form.push('L')}else{b.w++;a.l++;b.form.push('W');a.form.push('L')}});return Object.values(map).sort((a,b)=>b.w-a.w||((b.setsWon-b.setsLost)-(a.setsWon-a.setsLost))||((b.pointsWon-b.pointsLost)-(a.pointsWon-a.pointsLost))||b.setsWon-a.setsWon||displayName(a).localeCompare(displayName(b)))}
function formBadges(p){return `<span class="form-strip" aria-label="Letzte Ergebnisse">${(p.form||[]).slice(-5).map(x=>`<span class="form-badge ${x==='W'?'win':'loss'}">${x}</span>`).join('')||'<span class="muted">–</span>'}</span>`}
function record(p){return `${p.w} Siege · ${p.l} Niederlagen · Sätze ${p.setsWon}:${p.setsLost} · Punkte ${p.pointsWon}:${p.pointsLost}`}

function navigate(t){tab=t;selected=null;render()}function render(){let tabs=['Übersicht','Tabelle','Spieler','Matches','Spielorte','Playoffs','Verwaltung'];$('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));$('#content').innerHTML=({Übersicht:overview,Tabelle:ranking,Spieler:players,Matches:matches,Spielorte:venuesPage,Playoffs:playoffs,Verwaltung:admin})[tab]();wire()}
function overview(){let s=stats(),recent=[...data.matches].filter(m=>m.status==='completed').reverse().slice(0,5),upcoming=data.matches.filter(m=>m.status==='scheduled').sort((a,b)=>(a.scheduled_at||a.date).localeCompare(b.scheduled_at||b.date)).slice(0,5);return `<div class="grid"><div class="panel"><small>SPIELER</small><h1>${data.players.length}</h1></div><div class="panel"><small>GESPIELTE MATCHES</small><h1>${data.matches.filter(m=>m.status==='completed').length}</h1></div><div class="panel"><small>TABELLENFÜHRER</small><h1>${esc(s[0]?displayName(s[0]):'–')}</h1></div></div><div class="panel"><h2>Nächste Matches</h2>${matchList(upcoming)}</div><div class="panel"><h2>Aktuelle Tabelle</h2>${table(s.slice(0,5))}</div><div class="panel"><h2>Letzte Ergebnisse</h2>${matchList(recent)}</div><p class="muted">11.11.2026 – 01.07.2027 · Einzel · Best of 3 oder 5 · 2 Punkte Vorsprung</p>`}

function table(s){return `<div class="table-scroll"><table><thead><tr><th>#</th><th>Spieler</th><th>Sp</th><th>S</th><th>N</th><th>Sätze</th><th>Punkte</th><th>Form</th></tr></thead><tbody>${s.map((p,i)=>`<tr><td>${i+1}</td><td><span class="player-inline"><img class="avatar" src="${esc(photo(p))}" alt=""><span class="player-name">${esc(displayName(p))} <span class="country-flag">${flag(p.nationality)}</span></span></span></td><td>${p.played}</td><td>${p.w}</td><td>${p.l}</td><td>${p.setsWon}:${p.setsLost}</td><td>${p.pointsWon}:${p.pointsLost}</td><td>${formBadges(p)}</td></tr>`).join('')}</tbody></table></div>`}
function ranking(){return `<div class="panel"><h2>Ligatabelle</h2><p class="muted">Sortierung: Siege → Satzdifferenz → Punktedifferenz → gewonnene Sätze. Nur abgeschlossene Ligamatches zählen.</p>${table(stats())}</div>`}

function players(){if(selected){let p=stats().find(x=>x.id===selected);if(!p)return '<p>Spieler nicht gefunden.</p>';let detail=(label,value)=>`<div><small>${label}</small><strong>${esc(value||'–')}</strong></div>`;return `<button id="back">← Alle Spieler</button><div class="panel"><div class="profile-top"><img src="${esc(photo(p))}" alt="Profilbild"><div><h2 style="margin-bottom:6px">${esc(displayName(p))}</h2><div class="muted">${esc([p.first_name,p.last_name].filter(Boolean).join(' ')||p.name)}</div><p>${flag(p.nationality)} ${esc(p.nationality?countryNames.of(p.nationality):'Nationalität unbekannt')}</p><strong>${esc(record(p))}</strong>${p.active===false?' <span class="tag">Inaktiv</span>':''}</div></div><div class="profile-details">${detail('Vorname',p.first_name)}${detail('Nachname',p.last_name)}${detail('Spitzname',displayName(p))}${detail('Geburtsdatum',p.birth_date?fmt(p.birth_date):'–')}${detail('Größe',p.height_cm?p.height_cm+' cm':'–')}${detail('Spielhand',handLabel(p.playing_hand))}</div><h3>Letzte 5 Matches · Formkurve</h3>${formBadges(p)}<h3>Matchhistorie</h3>${matchList(data.matches.filter(m=>m.a===p.id||m.b===p.id).reverse())}</div>`}return `<h2>Spielerprofile</h2><div class="grid">${stats().map(p=>`<div class="panel player player-card" data-player="${esc(p.id)}" role="button" tabindex="0"><img src="${esc(photo(p))}" alt="Profilbild ${esc(displayName(p))}"><span class="player-name"><strong>${esc(displayName(p))}</strong> <span class="country-flag" aria-label="Nationalität">${flag(p.nationality)}</span></span>${p.active===false?'<span class="inactive-mark">Inaktiv</span>':''}</div>`).join('')||'<p class="muted">Noch keine Spieler vorhanden.</p>'}</div>`}
const venueName=id=>data.venues.find(v=>v.id===id)?.name||'Ort nicht angegeben';
const localDateTime=s=>s?new Date(s).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Termin offen';
const matchStatusLabel=s=>s==='completed'?'Abgeschlossen':s==='cancelled'?'Abgesagt':'Geplant';
function matchList(arr){return arr.length?arr.map(m=>{let sets=Array.isArray(m.sets)?m.sets:[],aw=sets.filter(s=>s[0]>s[1]).length,bw=sets.filter(s=>s[1]>s[0]).length;return `<div class="match-card"><div class="match-head"><span class="status-pill ${m.status==='completed'?'done':m.status==='cancelled'?'cancelled':''}">${matchStatusLabel(m.status)}</span><small>${m.scheduled_at?localDateTime(m.scheduled_at):fmt(m.date)} · Best of ${m.best_of||3}</small></div><div class="match-players">${esc(name(m.a))} <span class="muted">vs.</span> ${esc(name(m.b))}</div><div class="match-meta">📍 ${esc(venueName(m.venue_id))}</div>${m.status==='completed'?`<div class="score">${aw}:${bw}</div><small>${sets.map(s=>s.join(':')).join(' · ')}</small>`:''}${tab==='Matches'&&m.status==='scheduled'?`<div class="match-actions"><button type="button" data-public-result="${esc(m.id)}">Ergebnis eintragen</button></div>`:''}${isAdmin&&tab==='Verwaltung'?`<div class="match-actions"><button type="button" data-edit-match="${esc(m.id)}">Termin bearbeiten</button>${(m.status==='scheduled'||m.status==='completed')?`<button type="button" data-result-match="${esc(m.id)}">${m.status==='completed'?'Ergebnis korrigieren':'Ergebnis eintragen'}</button>${m.status==='scheduled'?`<button type="button" data-cancel-match="${esc(m.id)}">Absagen</button>`:''}`:''}${m.status==='cancelled'?`<button type="button" data-restore-match="${esc(m.id)}">Reaktivieren</button>`:''}<button type="button" data-delete="${esc(m.id)}">Löschen</button></div>`:''}</div>`}).join(''):'<p class="muted">Noch keine Matches vorhanden.</p>'}
function matches(){let upcoming=data.matches.filter(m=>m.status==='scheduled').sort((a,b)=>(a.scheduled_at||a.date).localeCompare(b.scheduled_at||b.date));let completed=data.matches.filter(m=>m.status==='completed').sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><h2>Spielplan · Anstehende Matches</h2>${matchList(upcoming)}</div><div class="panel"><h2>Ergebnisse</h2>${matchList(completed)}</div><div class="panel hidden" id="publicResultPanel"><h2>Ergebnis mit Liga-PIN eintragen</h2><p class="muted" id="publicResultLabel"></p><form id="publicResultForm"><input type="hidden" name="match_id"><div id="publicResultSets"></div><label>Liga-PIN / Passwort<input name="pin" type="password" required minlength="6" autocomplete="off" placeholder="Gemeinsames Liga-Passwort"></label><div class="actions"><button class="primary" type="submit" id="publicResultSave">Ergebnis bestätigen</button><button type="button" id="publicResultClose">Abbrechen</button></div></form><p class="form-help">Das Passwort wird auf dem Server geprüft und nicht auf dieser Website gespeichert.</p></div>`}
function venuesPage(){return `<h2>Spielorte</h2><div class="grid">${data.venues.filter(v=>v.active!==false).map(v=>`<div class="panel"><h3>${esc(v.name)}</h3>${v.image_url?`<img src="${esc(v.image_url)}" alt="" style="width:100%;height:165px;object-fit:cover;border-radius:10px">`:''}<p class="muted">${esc(v.city||'')}</p><p>${esc(v.description||'')}</p></div>`).join('')||'<p class="muted">Noch keine Spielorte angelegt.</p>'}</div>`}

function playoffs(){let seeds=stats().slice(0,4);return `<div class="panel"><h2>Playoffs · Top 4</h2><p class="muted">Nach Abschluss der regulären Saison: Halbfinale 1. gegen 4. und 2. gegen 3.; anschließend Finale. Die Paarungen werden hier anhand des aktuellen Tabellenstands angezeigt und können sich bis zum Saisonende ändern.</p>${seeds.length<4?'<p>Mindestens vier Spieler erforderlich.</p>':`<div class="grid"><div class="panel"><span class="tag">Halbfinale 1</span><h3>${esc(displayName(seeds[0]))} vs. ${esc(displayName(seeds[3]))}</h3></div><div class="panel"><span class="tag">Halbfinale 2</span><h3>${esc(displayName(seeds[1]))} vs. ${esc(displayName(seeds[2]))}</h3></div><div class="panel"><span class="tag">Finale</span><h3>Sieger HF 1 vs. Sieger HF 2</h3></div></div>`}</div>`}
function admin(){if(!session)return `<div class="panel"><h2>Admin-Anmeldung</h2><p class="muted">Nur die Ligaleitung kann Daten bearbeiten.</p><form id="login"><label>E-Mail<input name="email" type="email" required autocomplete="username"></label><label>Passwort<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Anmelden</button></form>${esc(statusMessage)}</div>`;if(!isAdmin)return `<div class="panel"><h2>Kein Admin-Zugriff</h2><p>Dieser Account hat keine Schreibberechtigung.</p><button id="logout">Abmelden</button></div>`;let opts=data.players.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${esc(displayName(p))}</option>`).join('');return `<div class="panel"><h2>Verwaltung</h2><p class="note">Änderungen werden zentral in Supabase gespeichert.</p><button id="logout">Abmelden</button><h3 id="playerFormHeading">Spieler hinzufügen</h3><form id="addPlayer"><input type="hidden" name="editing_id" value=""><div class="form-two"><label>Vorname<input name="first_name" required maxlength="60" placeholder="Vorname"></label><label>Nachname<input name="last_name" required maxlength="60" placeholder="Nachname"></label></div><label>Spitzname (Anzeige in der Liga)<input name="nickname" required maxlength="60" placeholder="z. B. El Matador"></label><div class="form-two"><label>Nationalität<select name="nationality" required><option value="">Land wählen</option>${countryOptions}</select></label><label>Geburtsdatum<input name="birth_date" type="date" max="${new Date().toISOString().slice(0,10)}"></label><label>Größe (cm)<input name="height_cm" type="number" min="80" max="250" step="1" placeholder="z. B. 177"></label><label>Spielhand<select name="playing_hand">${handOptions.map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}</select></label></div><label>Profilbild hochladen<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label><p class="form-help">Bild auswählen, anschließend Ausschnitt verschieben und zoomen.</p><img id="photoPreview" class="crop-preview hidden" alt="Zugeschnittenes Profilbild"><div style="margin:12px 0"><button class="primary" id="savePlayer" type="submit">Spieler hinzufügen</button> <button type="button" id="cancelEdit" class="hidden">Bearbeitung abbrechen</button></div></form><div id="cropModal" class="crop-overlay hidden"><div class="crop-box"><h3>Profilbild zuschneiden</h3><p class="muted">Bild verschieben und mit dem Mausrad oder per Zoom anpassen. Der Ausschnitt wird rund angezeigt.</p><div class="crop-stage"><img id="cropImage" alt="Bild zuschneiden"></div><div class="actions" style="margin-top:14px"><button type="button" id="cropZoomOut">− Zoom</button><button type="button" id="cropZoomIn">+ Zoom</button><button type="button" id="cropCancel">Abbrechen</button><button type="button" class="primary" id="cropConfirm">Ausschnitt übernehmen</button></div></div></div></div><div class="panel"><h3>Spieler verwalten</h3>${data.players.map(p=>`<div class="manage-row"><img src="${esc(photo(p))}" alt=""><div class="grow"><strong>${esc(displayName(p))} ${flag(p.nationality)}</strong><div class="muted">${p.active===false?'Inaktiv':'Aktiv'}</div></div><button type="button" data-edit-player="${esc(p.id)}">Bearbeiten</button><button type="button" data-toggle-player="${esc(p.id)}">${p.active===false?'Aktivieren':'Deaktivieren'}</button></div>`).join('')||'<p class="muted">Noch keine Spieler vorhanden.</p>'}</div><div class="panel"><h3 id="matchFormTitle">Match terminieren</h3><form id="matchForm"><input type="hidden" name="match_id"><label>Spieler A<select name="a" required>${opts}</select></label><label>Spieler B<select name="b" required>${opts}</select></label><label>Matchformat<select name="best_of" required><option value="3">Best of 3 (2 Gewinnsätze)</option><option value="5">Best of 5 (3 Gewinnsätze)</option></select></label><div class="form-two"><label>Datum<input type="date" name="date function setsUI(){let n=Number($('#format')?.value||3);$('#setInputs').innerHTML=`<p class="muted">Satzergebnisse (nur tatsächlich gespielte Sätze ausfüllen)</p><div class="sets">${Array.from({length:n},(_,i)=>`<label>Satz ${i+1} · Spieler A<input type="number" min="0" max="99" name="a${i}" placeholder="–"></label><label>Satz ${i+1} · Spieler B<input type="number" min="0" max="99" name="b${i}" placeholder="–"></label>`).join('')}</div>`}

function collectMatchSets(form,m){let sets=[],wins=[0,0],need=Math.ceil(Number(m.best_of)/2),ended=false,seenBlank=false;for(let i=0;i<Number(m.best_of);i++){let a=String(form.get('a'+i)??''),b=String(form.get('b'+i)??'');if(a===''&&b===''){seenBlank=true;continue}if(a===''||b==='')throw Error('Bitte beide Punktzahlen für Satz '+(i+1)+' eintragen.');if(seenBlank)throw Error('Bitte keine Sätze überspringen.');if(ended)throw Error('Nach dem entscheidenden Satz gibt es keine weiteren Sätze.');let x=Number(a),y=Number(b);if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>99||y>99||Math.max(x,y)<11||Math.abs(x-y)<2||(Math.max(x,y)>11&&Math.abs(x-y)!==2))throw Error('Satz '+(i+1)+' ist ungültig: mindestens 11 Punkte, genau 2 Punkte Vorsprung bei Verlängerung.');sets.push([x,y]);wins[x>y?0:1]++;if(Math.max(...wins)===need)ended=true}if(!ended)throw Error('Das Match ist noch nicht entschieden: '+need+' Gewinnsätze erforderlich.');return {sets,wins}}
function resultFields(m){return Array.from({length:Number(m.best_of||3)},(_,i)=>`<div class="match-result-row"><strong>Satz ${i+1}</strong><label>${esc(name(m.a))}<input type="number" name="a${i}" min="0" max="99" placeholder="–" value="${m.sets?.[i]?.[0]??''}"></label><label>${esc(name(m.b))}<input type="number" name="b${i}" min="0" max="99" placeholder="–" value="${m.sets?.[i]?.[1]??''}"></label></div>`).join('')}

function fillMatchForm(m){let f=$('#matchForm');if(!f)return;editingMatchId=m.id;f.elements.namedItem('match_id').value=m.id;for(let [key,val] of [['a',m.a],['b',m.b],['best_of',m.best_of||3],['venue_id',m.venue_id||''],['date',m.date],['time',m.scheduled_at?m.scheduled_at.slice(11,16):'18:00']]){let el=f.elements.namedItem(key);if(el){if(key==='a'||key==='b'){if(![...el.options].some(o=>o.value===val))el.add(new Option(name(val),val))}el.value=val}}$('#matchFormTitle').textContent='Match bearbeiten';$('#saveMatch').textContent='Änderungen speichern';$('#resetMatch').classList.remove('hidden');f.scrollIntoView({behavior:'smooth',block:'start'})}

if($('#export'))$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='team-kalo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('#import'))$('#import').onchange=()=>alert('Import in die zentrale Datenbank ist noch nicht eingerichtet. Bitte JSON als Backup behalten.');if($('#login'))$('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await db.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(error){statusMessage=error.message;render()}};if($('#logout'))$('#logout').onclick=()=>db.auth.signOut()}
async function refreshAuth(){let {data:auth}=await db.auth.getSession();session=auth.session;isAdmin=false;if(session){let {data:rows,error}=await db.from('admins').select('user_id').eq('user_id',session.user.id).limit(1);isAdmin=!error&&rows?.length===1}render()}
async function loadData(){let [pr,mr,vr]=await Promise.all([db.from('players').select('id,name,first_name,last_name,nickname,nationality,birth_date,height_cm,playing_hand,photo_url,active,created_at').order('created_at'),db.from('matches').select('id,player1_id,player2_id,match_date,scheduled_at,venue_id,status,best_of,sets,stage,created_at').order('created_at'),db.from('venues').select('id,name,city,description,image_url,active,created_at').order('name')]);if(pr.error||mr.error||vr.error){statusMessage=(pr.error||mr.error||vr.error).message;console.error(statusMessage);return alert('Daten konnten nicht geladen werden: '+statusMessage+' (SQL-Migration bereits ausgeführt?)')}data.players=pr.data.map(p=>({active:p.active!==false,id:p.id,name:p.name,first_name:p.first_name,last_name:p.last_name,nickname:p.nickname||p.name,nationality:p.nationality,birth_date:p.birth_date,height_cm:p.height_cm,playing_hand:p.playing_hand,photo:p.photo_url||''}));data.matches=mr.data.map(m=>({id:m.id,a:m.player1_id,b:m.player2_id,date:m.match_date,scheduled_at:m.scheduled_at,venue_id:m.venue_id,status:m.status||'completed',best_of:m.best_of||3,sets:m.sets||[],created:m.created_at,stage:m.stage}));data.venues=vr.data;render()}
(async()=>{await refreshAuth();await loadData();db.auth.onAuthStateChange(()=>{setTimeout(refreshAuth,0)});// Automatische Aktualisierung deaktiviert, damit Formulareingaben erhalten bleiben.
})();
</script></body></html>
