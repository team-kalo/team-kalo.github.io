<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Kalo | Pickleball League</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f4f4f4;background:#101820}*{box-sizing:border-box}body{margin:0}header{background:#192733;border-bottom:1px solid #35434c;padding:16px 5%;display:flex;align-items:center;gap:16px}header img{height:75px;width:75px;object-fit:contain;border-radius:12px}h1{margin:0;font-size:clamp(22px,4vw,38px)}small,.muted{color:#aab8c3}main{max-width:1100px;margin:auto;padding:25px 18px 80px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tabs button,button{background:#2b4353;color:white;border:1px solid #547084;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:650}.tabs button.active,button.primary{background:#eeb64a;color:#151c23;border-color:#eeb64a}.panel{background:#1a2935;border:1px solid #324451;border-radius:15px;padding:20px;margin:15px 0}h2{margin:0 0 16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #344653}th{color:#b9c6cd;font-size:13px}td:last-child,th:last-child{text-align:right}.avatar{width:40px;height:40px;object-fit:cover;border-radius:50%;background:#364958;vertical-align:middle;margin-right:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.player{display:flex;align-items:center;gap:10px;cursor:pointer}.player img{width:62px;height:62px;object-fit:cover;border-radius:50%;background:#344654}.match{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #344653;padding:14px 0}.match:last-child{border:0}.score{font-size:22px;font-weight:800;color:#eeb64a}input,select{width:100%;padding:11px;background:#101b24;color:white;border:1px solid #526574;border-radius:8px;margin:6px 0 14px}label{font-size:14px;color:#cbd7dc}form{max-width:650px}.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.note{background:#263b48;border-left:3px solid #eeb64a;padding:12px;border-radius:5px}.hidden{display:none}.tag{display:inline-block;border-radius:20px;background:#334b59;padding:5px 10px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}a{color:#f4c66b}@media(max-width:500px){th,td{padding:10px 3px;font-size:13px}.avatar{width:30px;height:30px;margin-right:5px}.panel{padding:14px}}
</style></head><body><header><img src="assets/logo.png" alt="Team Kalo Logo"><div><h1>TEAM KALO</h1><div class="muted">PICKLEBALL LEAGUE · SAISON 2026/27</div><small>Euregio-Sporthalle · Emsdetten</small></div></header><main><div class="tabs" id="tabs"></div><div id="content"></div></main><script>
const KEY='team-kalo-v1';const sample={players:[],matches:[],playoffs:[],phase:'league'};let data=JSON.parse(localStorage.getItem(KEY)||'null')||sample;let tab='Übersicht';let selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const uid=()=>crypto.randomUUID();const photo=p=>p.photo||'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(p.name);const name=id=>data.players.find(p=>p.id===id)?.name||'Unbekannt';const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE');
function stats(){let map={};data.players.forEach(p=>map[p.id]={...p,elo:1000,w:0,l:0,played:0});[...data.matches].sort((a,b)=>a.date.localeCompare(b.date)||a.created.localeCompare(b.created)).forEach(m=>{let a=map[m.a],b=map[m.b];if(!a||!b)return;let aw=m.sets.filter(s=>s[0]>s[1]).length,bw=m.sets.filter(s=>s[1]>s[0]).length;if(aw===bw)return;let winner=aw>bw?a:b,loser=aw>bw?b:a;let expected=1/(1+Math.pow(10,(loser.elo-winner.elo)/400));let change=Math.round(32*(1-expected));winner.elo+=change;loser.elo-=change;winner.w++;loser.l++;winner.played++;loser.played++});return Object.values(map).sort((a,b)=>b.elo-a.elo||b.w-a.w||a.name.localeCompare(b.name))}
function navigate(t){tab=t;selected=null;render()}function render(){let tabs=['Übersicht','Tabelle','Spieler','Matches','Playoffs','Verwaltung'];$('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));$('#content').innerHTML=({Übersicht:overview,Tabelle:ranking,Spieler:players,Matches:matches,Playoffs:playoffs,Verwaltung:admin})[tab]();wire()}
function overview(){let s=stats(),recent=[...data.matches].reverse().slice(0,5);return `<div class="grid"><div class="panel"><small>SPIELER</small><h1>${data.players.length}</h1></div><div class="panel"><small>GESPIELTE MATCHES</small><h1>${data.matches.length}</h1></div><div class="panel"><small>TABELLENFÜHRER</small><h1>${esc(s[0]?.name||'–')}</h1></div></div><div class="panel"><h2>Aktuelle Tabelle</h2>${table(s.slice(0,5))}</div><div class="panel"><h2>Letzte Matches</h2>${matchList(recent)}</div><p class="muted">11.11.2026 – 01.07.2027 · Einzel · Best of 3 oder 5 · Sätze bis 11</p>`}
function table(s){return `<table><thead><tr><th>#</th><th>Spieler</th><th>Spiele</th><th>S</th><th>N</th><th>Elo</th></tr></thead><tbody>${s.map((p,i)=>`<tr><td>${i+1}</td><td><img class="avatar" src="${esc(photo(p))}" alt="">${esc(p.name)}</td><td>${p.played}</td><td>${p.w}</td><td>${p.l}</td><td><strong>${p.elo}</strong></td></tr>`).join('')}</tbody></table>`}function ranking(){return `<div class="panel"><h2>Ligatabelle</h2><p class="muted">Alle starten bei 1.000 Elo. Pro Match werden anhand der gegnerischen Stärke Punkte vergeben.</p>${table(stats())}</div>`}function players(){if(selected){let p=stats().find(x=>x.id===selected);if(!p)return '';return `<button id="back">← Alle Spieler</button><div class="panel"><img class="avatar" style="width:100px;height:100px" src="${esc(photo(p))}"><h2>${esc(p.name)}</h2><p>${p.elo} Elo · ${p.w} Siege · ${p.l} Niederlagen</p><h3>Matchhistorie</h3>${matchList(data.matches.filter(m=>m.a===p.id||m.b===p.id).reverse())}</div>`}return `<h2>Spielerprofile</h2><div class="grid">${stats().map(p=>`<div class="panel player" data-player="${p.id}"><img src="${esc(photo(p))}" alt=""><div><strong>${esc(p.name)}</strong><div class="muted">${p.elo} Elo · ${p.w}S / ${p.l}N</div></div></div>`).join('')}</div>`}
function matchList(arr){return arr.length?arr.map(m=>{let aw=m.sets.filter(s=>s[0]>s[1]).length,bw=m.sets.length-aw;return `<div class="match"><div><small>${fmt(m.date)}</small><div><strong>${esc(name(m.a))}</strong> vs. <strong>${esc(name(m.b))}</strong></div><small>${m.sets.map(s=>s.join(':')).join(' · ')}</small></div><div class="score">${aw}:${bw}</div></div>`}).join(''):'<p class="muted">Noch keine Ergebnisse vorhanden.</p>'}function matches(){return `<div class="panel"><h2>Alle Ergebnisse</h2>${matchList([...data.matches].sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
function playoffs(){let seeds=stats().slice(0,4);return `<div class="panel"><h2>Playoffs · Top 4</h2><p class="muted">Nach Abschluss der regulären Saison: Halbfinale 1. gegen 4. und 2. gegen 3.; anschließend Finale. Die Paarungen werden hier anhand des aktuellen Tabellenstands angezeigt und können sich bis zum Saisonende ändern.</p>${seeds.length<4?'<p>Mindestens vier Spieler erforderlich.</p>':`<div class="grid"><div class="panel"><span class="tag">Halbfinale 1</span><h3>${esc(seeds[0].name)} vs. ${esc(seeds[3].name)}</h3></div><div class="panel"><span class="tag">Halbfinale 2</span><h3>${esc(seeds[1].name)} vs. ${esc(seeds[2].name)}</h3></div><div class="panel"><span class="tag">Finale</span><h3>Sieger HF 1 vs. Sieger HF 2</h3></div></div>`}</div>`}
function admin(){let opts=data.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');return `<div class="panel"><h2>Verwaltung</h2><p class="note">Diese erste Version speichert Änderungen nur im aktuellen Browser. Andere Geräte sehen sie noch nicht. Für eine gemeinsame Live-Liga verbinden wir als nächsten Schritt eine Datenbank.</p><h3>Spieler hinzufügen</h3><form id="addPlayer"><label>Name<input name="name" required maxlength="50" placeholder="Spielername"></label><label>Profilbild-URL (optional)<input name="photo" type="url" placeholder="https://..."></label><button class="primary">Spieler hinzufügen</button></form></div><div class="panel"><h3>Match eintragen</h3><form id="addMatch"><label>Datum<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>Spieler A<select name="a" required>${opts}</select></label><label>Spieler B<select name="b" required>${opts}</select></label><label>Format<select id="format" name="format"><option value="3">Best of 3</option><option value="5">Best of 5</option></select></label><div id="setInputs"></div><button class="primary" ${data.players.length<2?'disabled':''}>Ergebnis speichern</button></form></div><div class="panel"><h3>Ergebnisse korrigieren / löschen</h3>${[...data.matches].reverse().map(m=>`<div class="match"><span>${fmt(m.date)} · ${esc(name(m.a))} – ${esc(name(m.b))} · ${m.sets.map(s=>s.join(':')).join(', ')}</span><button data-delete="${m.id}">Löschen</button></div>`).join('')||'<p class="muted">Noch keine Matches.</p>'}</div><div class="panel"><h3>Daten sichern</h3><p class="muted">Exportiere die Liga als JSON-Datei. Du kannst diese später wieder importieren.</p><div class="actions"><button id="export">JSON exportieren</button><label>JSON importieren<input id="import" type="file" accept="application/json"></label></div></div>`}
function setsUI(){let n=Number($('#format')?.value||3);$('#setInputs').innerHTML=`<p class="muted">Satzergebnisse (nur tatsächlich gespielte Sätze ausfüllen)</p><div class="sets">${Array.from({length:n},(_,i)=>`<label>Satz ${i+1} · Spieler A<input type="number" min="0" max="99" name="a${i}" placeholder="–"></label><label>Satz ${i+1} · Spieler B<input type="number" min="0" max="99" name="b${i}" placeholder="–"></label>`).join('')}</div>`}
function wire(){document.querySelectorAll('[data-player]').forEach(el=>el.onclick=()=>{selected=el.dataset.player;render()});if($('#back'))$('#back').onclick=()=>{selected=null;render()};if($('#format')){$('#format').onchange=setsUI;setsUI()}if($('#addPlayer'))$('#addPlayer').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.players.push({id:uid(),name:String(f.get('name')).trim(),photo:String(f.get('photo')).trim()});save();render()};if($('#addMatch'))$('#addMatch').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),a=f.get('a'),b=f.get('b'),n=Number(f.get('format'));if(a===b)return alert('Bitte zwei unterschiedliche Spieler wählen.');let sets=[];for(let i=0;i<n;i++){let x=f.get('a'+i),y=f.get('b'+i);if(x===''&&y==='')continue;if(x===''||y==='')return alert('Bitte beide Werte eines Satzes eingeben.');let u=Number(x),v=Number(y);if(u===v)return alert('Ein Satz darf nicht unentschieden enden.');if(Math.max(u,v)<11||Math.abs(u-v)<2)return alert('Sätze müssen bis mindestens 11 und mit zwei Punkten Vorsprung gespielt werden.');sets.push([u,v])}let aw=sets.filter(s=>s[0]>s[1]).length,bw=sets.length-aw,need=Math.ceil(n/2);if(Math.max(aw,bw)!==need||sets.length!==aw+bw||sets.length>n)return alert('Bitte ein vollständiges Best-of-'+n+'-Ergebnis eingeben.');data.matches.push({id:uid(),a,b,date:f.get('date'),sets,created:new Date().toISOString()});save();render()};document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{if(confirm('Dieses Match wirklich löschen?')){data.matches=data.matches.filter(m=>m.id!==el.dataset.delete);save();render()}});if($('#export'))$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='team-kalo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('#import'))$('#import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.players)||!Array.isArray(v.matches))throw Error('Ungültige Datei');if(confirm('Aktuelle lokale Daten durch Import ersetzen?')){data=v;save();render()}}catch{alert('Die JSON-Datei konnte nicht gelesen werden.')}}}render();
</script></body></html>
